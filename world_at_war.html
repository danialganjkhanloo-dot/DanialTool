function shape(p){let x=p.x,y=p.y,w=p.w,h=p.h;return [[x+w*.08,y+h*.03],[x+w*.82,y],[x+w,y+h*.18],[x+w*.93,y+h*.58],[x+w*.72,y+h],[x+w*.27,y+h*.93],[x,y+h*.67],[x+w*.03,y+h*.2]]}function path(a){ctx.beginPath();a.forEach((q,i)=>{let [x,y]=W(q[0],q[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}

function hit(sx,sy){let [x,y]=IW(sx,sy);for(const p of Object.values(S.p).reverse()){let a=shape(p),inside=false;for(let i=0,j=a.length-1;i<a.length;j=i++){let xi=a[i][0],yi=a[i][1],xj=a[j][0],yj=a[j][1],z=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);if(z)inside=!inside}if(inside)return p}}
can.onmousedown=e=>{drag=true;lx=e.clientX;ly=e.clientY};window.onmouseup=()=>drag=false;window.onmousemove=e=>{if(drag){S.ox+=e.clientX-lx;S.oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw()}let p=hit(e.clientX,e.clientY),t=$('tip');if(p){t.style.display='block';t.style.left=(e.clientX-$('wrap').getBoundingClientRect().left+12)+'px';t.style.top=(e.clientY-$('wrap').getBoundingClientRect().top+12)+'px';t.innerHTML='<b>'+p.name+'</b><br>'+C[p.owner]?.[0]+'<br>🏭 '+p.ind+' · 👥 '+p.pop+'M · ⛽ '+p.oil}else t.style.display='none'};can.oncontextmenu=e=>{e.preventDefault();S.prov=null;draw();render()};can.onclick=e=>{if(drag)return;let p=hit(e.clientX,e.clientY);if(p){S.prov=p.id;S.sel=p.owner;render();draw()}};can.onwheel=e=>{e.preventDefault();S.z=cl(S.z*(e.deltaY<0?1.1:.9),.6,3);draw()};
function zoom(f){S.z=cl(S.z*f,.6,3);draw()}function resetMap(){S.z=1;S.ox=S.oy=0;draw()}
function render(){let c=S.c[S.sel];$('stats').innerHTML='<div class="stat">📅 <b>'+S.date.join('/')+'</b></div><div class="stat">💰 <b>'+F(c.money)+'</b></div><div class="stat">⛽ <b>'+F(c.fuel)+'</b></div><div class="stat">🏭 <b>'+F(c.ind)+'</b></div><div class="stat">🪖 <b>'+F(c.mp)+'M</b></div><div class="stat">📈 <b>'+Math.round(c.approval)+'%</b></div>';$('date').textContent=S.date[0]+' / '+String(S.date[1]).padStart(2,'0')+' / '+String(S.date[2]).padStart(2,'0')+' — '+String(S.date[3]).padStart(2,'0')+':00';$('news').textContent=S.news[0];let box=$('countries');box.innerHTML='';for(const [id,x] of Object.entries(S.c)){let b=document.createElement('button');b.className='country'+(id===S.sel?' active':'');b.innerHTML='<span class="flag">'+x.flag+'</span><span style="flex:1"><b>'+x.name+'</b><br><span class="muted">🏭 '+F(x.ind)+' · ⛽ '+F(x.fuel)+'</span></span>';b.onclick=()=>{S.sel=id;S.prov=null;render();draw()};box.appendChild(b)}let ps=Object.values(S.p).filter(p=>p.owner===S.sel),us=S.u.filter(u=>u.country===S.sel);let pc='<div class="card"><div style="font-size:18px;font-weight:bold">'+c.flag+' '+c.name+'</div><span class="muted">قدرت صنعتی '+F(c.ind)+' · '+c.at.length+' جنگ فعال</span><div class="row"><span>ثبات</span><b>'+Math.round(c.stability)+'%</b></div><div class="bar g"><span style="width:'+c.stability+'%"></span></div><div class="row"><span>حمایت جنگی</span><b>'+Math.round(c.approval)+'%</b></div><div class="bar w"><span style="width:'+c.approval+'%"></span></div></div><div class="card"><div class="title">اقتصاد</div><div class="row"><span>🏭 صنعت</span><b>'+F(c.ind)+'</b></div><div class="row"><span>⛽ سوخت</span><b>'+F(c.fuel)+'</b></div><div class="row"><span>🪨 فولاد</span><b>'+F(c.steel)+'</b></div><div class="row"><span>🌾 غذا</span><b>'+F(c.food)+'</b></div><div class="row"><span>💰 بودجه</span><b>'+F(c.money)+'</b></div></div><div class="card"><div class="title">ارتش</div><div class="row"><span>واحدها</span><b>'+us.length+'</b></div><div class="row"><span>استان‌ها</span><b>'+ps.length+'</b></div><button style="width:100%" onclick="recruit()">🪖 جذب نیرو</button></div>';
if(S.prov){let p=S.p[S.prov],enemy=p.owner!==S.sel;pc+='<div class="card"><div class="title">📍 استان</div><b>'+p.name+'</b><div class="muted">'+(C[p.owner]?.[0]||'بی‌طرف')+' · '+p.terrain+'</div><div class="row"><span>جمعیت</span><b>'+p.pop+'M</b></div><div class="row"><span>صنعت</span><b>'+p.ind+'</b></div><button style="width:100%" onclick="'+(enemy?'attack()':'moveMenu()')+'">'+(enemy?'⚔️ حمله':'🧭 حرکت ارتش')+'</button></div>'}$('pc').innerHTML=pc;let cnt={};us.forEach(u=>cnt[u.type]=(cnt[u.type]||0)+1);$('pa').innerHTML='<div class="card"><div class="title">واحدها</div>'+Object.entries(T).map(([t,x])=>'<div class="row"><span>'+x[1]+' '+x[0]+'</span><b>'+(cnt[t]||0)+'</b></div>').join('')+'</div>'+us.slice(0,40).map(u=>'<div class="unit"><b>'+T[u.type][1]+' '+T[u.type][0]+'</b> · '+Math.round(u.str)+'%<br><span class="muted">'+S.p[u.province].name+' · روحیه '+Math.round(u.mor)+' · تجربه '+Math.round(u.xp)+'</span></div>').join('');$('pi').innerHTML=Object.entries(S.c).filter(([id])=>id!==S.sel).map(([id,x])=>'<div class="card"><div class="row"><b>'+x.flag+' '+x.name+'</b><span>'+((x.at.includes(S.sel))?'⚔️':((S.rel[S.sel+'|'+id]||0)>60?'🟢':'🟡'))+'</span></div><div class="row"><span>رابطه</span><b>'+Math.round(S.rel[S.sel+'|'+id]||0)+'</b></div><div class="row"><span>قدرت صنعتی</span><b>'+F(x.ind)+'</b></div></div>').join('')}
function tab(x){for(const y of ['c','a','i']){$('p'+y).classList.toggle('hidden',y!==x);$('t'+y).classList.toggle('on',y===x)}}
function recruit(){let c=S.c[S.sel];if(c.mp<1){news('نیروی انسانی کافی نیست.');return}c.mp--;c.prod.inf+=.9;news(c.name+' یک برنامه جذب نیرو آغاز کرد.');render()}
function modal(x){$('modal').innerHTML=x;$('mb').style.display='flex'}function close(){ $('mb').style.display='none'}$('mb').onclick=e=>{if(e.target===$('mb'))close()}
function warMenu(){let a=S.sel;modal('<h2>⚔️ اعلام جنگ</h2><p>انتخاب هدف، رابطه را به -100 می‌رساند و اقتصاد وارد وضعیت جنگی می‌شود.</p><div class="grid">'+Object.keys(S.c).filter(b=>b!==a&&!atwar(a,b)).map(b=>'<button onclick="war(\''+a+'\',\''+b+'\');close();render()">'+S.c[b].flag+' '+S.c[b].name+'<br><span class="muted">رابطه '+Math.round(S.rel[a+'|'+b])+'</span></button>').join('')+'</div>')}
function diploMenu(){let a=S.sel;modal('<h2>🤝 دیپلماسی</h2><div class="grid">'+Object.keys(S.c).filter(b=>b!==a).map(b=>'<button onclick="diplomacy(\''+a+'\',\''+b+'\')">'+S.c[b].flag+' '+S.c[b].name+'<br><span class="muted">'+(atwar(a,b)?'⚔️ پایان جنگ':'رابطه '+Math.round(S.rel[a+'|'+b]))+'</span></button>').join('')+'</div>')}
function diplomacy(a,b){if(atwar(a,b))peace(a,b);else{S.rel[a+'|'+b]=cl((S.rel[a+'|'+b]||0)+12,-100,100);S.rel[b+'|'+a]=S.rel[a+'|'+b];news('🤝 روابط '+S.c[a].name+' و '+S.c[b].name+' بهتر شد.')}close();render()}
function researchMenu(){modal('<h2>🔬 فناوری</h2><p>با سرمایه‌گذاری 20 بودجه، فناوری کشور رشد می‌کند و برخی توانایی‌ها تقویت می‌شوند.</p><div class="grid">'+['لجستیک','زرهی','نیروی هوایی','صنعت','دکترین'].map((x,i)=>'<button onclick="research('+i+');close()">🔬 '+x+'<br><span class="muted">هزینه 20 · ارتقای فناوری</span></button>').join('')+'</div>')}function research(i){let c=S.c[S.sel];if(c.money<20){news('بودجه پژوهش کافی نیست.');return}c.money-=20;c.tech+=2;if(i===3)c.ind+=3;if(i===1)S.u.filter(u=>u.country===S.sel&&u.type==='tank').forEach(u=>u.xp+=3);if(i===4)c.stability+=1;news('🔬 '+c.name+' در پژوهش پیشرفت کرد.');render()}
function moveMenu(){let p=S.p[S.prov],us=S.u.filter(u=>u.country===S.sel&&u.province===p.id&&!u.target),ns=p.n.map(n=>S.p[n]).filter(Boolean);modal('<h2>🧭 حرکت از '+p.name+'</h2><p>'+us.length+' واحد آماده حرکت هستند.</p><div class="grid">'+ns.map(q=>'<button onclick="send(\''+p.id+'\',\''+q.id+'\');close()">➡️ '+q.name+'<br><span class="muted">'+(C[q.owner]?.[0]||'بی‌طرف')+'</span></button>').join('')+'</div>')}
function send(a,b){let us=S.u.filter(u=>u.country===S.sel&&u.province===a&&!u.target);us.slice(0,Math.max(1,Math.floor(us.length*.6))).forEach(u=>u.target=b);news(us.length+' واحد به سمت '+S.p[b].name+' حرکت کردند.')}
function attack(){let t=S.p[S.prov],from=Object.values(S.p).filter(p=>p.owner===S.sel&&p.n.includes(t.id));if(!from.length){news('مسیر زمینی مستقیم وجود ندارد.');return}if(!atwar(S.sel,t.owner))war(S.sel,t.owner);from.forEach(p=>S.u.filter(u=>u.country===S.sel&&u.province===p.id&&!u.target).slice(0,5).forEach(u=>u.target=t.id));news('⚔️ عملیات علیه '+t.name+' آغاز شد.');render()}
function save(){localStorage.WAW=JSON.stringify(S);news('💾 بازی ذخیره شد.')}function load(){try{S=JSON.parse(localStorage.WAW);render();draw();news('📂 بازی بارگذاری شد.')}catch(e){news('ذخیره‌ای پیدا نشد.')}}
$('pause').onclick=()=>{S.paused=!S.paused;$('pause').textContent=S.paused?'▶️':'⏸️'};$('speed').onclick=e=>{S.speed=S.speed===1?2:S.speed===2?4:S.speed===4?8:1;e.target.textContent='⏩ '+S.speed+'x'};
let last=performance.now(),acc=0;function loop(t){let d=t-last;last=t;if(!S.paused){acc+=d;let step=500/S.speed;while(acc>step){acc-=step;S.date[3]+=1;if(S.date[3]>=24){S.date[3]=0;day();}}}requestAnimationFrame(loop)}init();resize();render();draw();requestAnimationFrame(loop);
</script></body></html>
