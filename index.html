<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DanialTool</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Vazirmatn", sans-serif;
    background:
        radial-gradient(circle at top right, #172554, transparent 35%),
        radial-gradient(circle at bottom left, #111827, transparent 40%),
        #050816;
    color: #fff;
    min-height: 100vh;
}

.container {
    width: min(1100px, 94%);
    margin: auto;
    padding: 35px 0 50px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 38px;
    margin: 0 0 8px;
    font-weight: 800;
}

header p {
    margin: 0;
    color: #aeb8cc;
}

.tools {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
}

.tool {
    border: 1px solid #27324b;
    background: rgba(15, 23, 42, 0.75);
    color: white;
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    text-align: right;
    transition: .2s;
    font-family: inherit;
}

.tool:hover {
    transform: translateY(-2px);
    border-color: #4f7cff;
    background: rgba(30, 41, 70, .9);
}

.tool.active {
    border-color: #668cff;
    background: linear-gradient(135deg, #1d315f, #172554);
}

.icon {
    font-size: 25px;
    display: block;
    margin-bottom: 7px;
}

.tool-name {
    font-size: 15px;
    font-weight: 700;
}

.panel {
    background: rgba(10, 17, 34, .85);
    border: 1px solid #27324b;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.panel h2 {
    margin-top: 0;
    font-size: 23px;
}

.form {
    display: grid;
    gap: 13px;
}

label {
    color: #c8d1e3;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid #33415f;
    background: #0b1224;
    color: white;
    font-family: inherit;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #668cff;
}

button.main-btn,
button.secondary-btn {
    border: 0;
    border-radius: 13px;
    padding: 13px 18px;
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.main-btn {
    background: linear-gradient(135deg, #4169e1, #6366f1);
}

.secondary-btn {
    background: #1b263d;
    border: 1px solid #33415f !important;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 5px;
}

.result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: #0b1224;
    border: 1px solid #293652;
    min-height: 55px;
    line-height: 2;
    color: #e9eef9;
    white-space: pre-wrap;
}

.error {
    color: #ff8f8f;
}

.success {
    color: #9effb1;
}

footer {
    text-align: center;
    color: #68758e;
    margin-top: 25px;
    font-size: 13px;
}

.hidden {
    display: none !important;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 30px;
    }

    .panel {
        padding: 18px;
    }

    .tools {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🧰 DanialTool</h1>
    <p>ابزارهای کاربردی ریاضی و محاسباتی</p>
</header>

<div class="tools">

    <button class="tool active" data-tool="average">
        <span class="icon">📊</span>
        <span class="tool-name">معدل</span>
    </button>

    <button class="tool" data-tool="percent">
        <span class="icon">٪</span>
        <span class="tool-name">درصد</span>
    </button>

    <button class="tool" data-tool="shape">
        <span class="icon">📐</span>
        <span class="tool-name">محیط و مساحت</span>
    </button>

    <button class="tool" data-tool="calculator">
        <span class="icon">🧮</span>
        <span class="tool-name">ماشین حساب</span>
    </button>

    <button class="tool" data-tool="gcf">
        <span class="icon">🔢</span>
        <span class="tool-name">ب.م.م و ک.م.م</span>
    </button>

    <button class="tool" data-tool="discount">
        <span class="icon">🏷️</span>
        <span class="tool-name">تخفیف</span>
    </button>

    <button class="tool" data-tool="convert">
        <span class="icon">🔄</span>
        <span class="tool-name">تبدیل واحد</span>
    </button>

    <button class="tool" data-tool="speed">
        <span class="icon">🚗</span>
        <span class="tool-name">سرعت، مسافت، زمان</span>
    </button>

    <button class="tool" data-tool="fraction">
        <span class="icon">½</span>
        <span class="tool-name">کسر و درصد</span>
    </button>

    <button class="tool" data-tool="power">
        <span class="icon">x²</span>
        <span class="tool-name">توان و ریشه</span>
    </button>

    <button class="tool" data-tool="divisibility">
        <span class="icon">➗</span>
        <span class="tool-name">بخش‌پذیری</span>
    </button>

    <button class="tool" data-tool="evenodd">
        <span class="icon">⚖️</span>
        <span class="tool-name">زوج یا فرد</span>
    </button>

    <button class="tool" data-tool="prime">
        <span class="icon">⭐</span>
        <span class="tool-name">عدد اول</span>
    </button>

    <button class="tool" data-tool="division">
        <span class="icon">➗</span>
        <span class="tool-name">خارج قسمت</span>
    </button>

    <button class="tool" data-tool="multiply">
        <span class="icon">✖️</span>
        <span class="tool-name">جدول ضرب</span>
    </button>

</div>

<div class="panel">

    <h2 id="title">📊 محاسبه معدل</h2>

    <div id="form" class="form"></div>

    <div class="buttons">
        <button class="main-btn" id="runBtn">▶️ اجرای ابزار</button>
        <button class="secondary-btn" id="copyBtn">📋 کپی نتیجه</button>
        <button class="secondary-btn" id="clearBtn">🗑️ پاک کردن</button>
    </div>

    <div id="result" class="result">
        نتیجه اینجا نمایش داده می‌شود.
    </div>

</div>

<footer>
    DanialTool • ساخته شده با ❤️
</footer>

</div>

<script>

let currentTool = "average";

const titles = {
    average: "📊 محاسبه معدل",
    percent: "٪ محاسبه درصد",
    shape: "📐 محیط و مساحت",
    calculator: "🧮 ماشین حساب",
    gcf: "🔢 ب.م.م و ک.م.م",
    discount: "🏷️ محاسبه تخفیف",
    convert: "🔄 تبدیل واحد",
    speed: "🚗 سرعت، مسافت و زمان",
    fraction: "½ کسر، اعشار و درصد",
    power: "x² توان و ریشه",
    divisibility: "➗ بخش‌پذیری",
    evenodd: "⚖️ زوج یا فرد",
    prime: "⭐ عدد اول",
    division: "➗ خارج قسمت و باقی‌مانده",
    multiply: "✖️ جدول ضرب"
};

const form = document.getElementById("form");
const result = document.getElementById("result");
const title = document.getElementById("title");

function input(id, labelText, type="number", placeholder="") {
    return `
        <div>
            <label>${labelText}</label>
            <input id="${id}" type="${type}" placeholder="${placeholder}">
        </div>
    `;
}

function select(id, labelText, options) {
    return `
        <div>
            <label>${labelText}</label>
            <select id="${id}">
                ${options.map(x => `<option value="${x[0]}">${x[1]}</option>`).join("")}
            </select>
        </div>
    `;
}

function showForm() {

    title.textContent = titles[currentTool];

    let html = "";

    if (currentTool === "average") {
        html =
            input("count", "تعداد نمره‌ها", "number", "مثلاً 5") +
            `<div id="grades"></div>`;
    }

    else if (currentTool === "percent") {
        html =
            input("percent", "چند درصد؟") +
            input("number", "از چه عددی؟");
    }

    else if (currentTool === "shape") {
        html =
            select("shapeType", "شکل را انتخاب کنید", [
                ["square", "مربع"],
                ["rectangle", "مستطیل"],
                ["circle", "دایره"],
                ["triangle", "مثلث"]
            ]) +
            `<div id="shapeInputs"></div>`;
    }

    else if (currentTool === "calculator") {
        html = input(
            "expression",
            "عبارت ریاضی",
            "text",
            "مثلاً 25 * 4 + 10"
        );
    }

    else if (currentTool === "gcf") {
        html =
            input("a", "عدد اول") +
            input("b", "عدد دوم");
    }

    else if (currentTool === "discount") {
        html =
            input("price", "قیمت اصلی") +
            input("discount", "درصد تخفیف");
    }

    else if (currentTool === "convert") {
        html =
            select("conversion", "نوع تبدیل", [
                ["cm_m", "سانتی‌متر → متر"],
                ["m_cm", "متر → سانتی‌متر"],
                ["kg_g", "کیلوگرم → گرم"],
                ["g_kg", "گرم → کیلوگرم"],
                ["c_f", "سلسیوس → فارنهایت"],
                ["f_c", "فارنهایت → سلسیوس"],
                ["min_sec", "دقیقه → ثانیه"],
                ["sec_min", "ثانیه → دقیقه"],
                ["hour_min", "ساعت → دقیقه"],
                ["min_hour", "دقیقه → ساعت"]
            ]) +
            input("value", "مقدار");
    }

    else if (currentTool === "speed") {
        html =
            select("speedType", "چه چیزی را می‌خواهید حساب کنید؟", [
                ["speed", "سرعت"],
                ["distance", "مسافت"],
                ["time", "زمان"]
            ]) +
            `<div id="speedInputs"></div>`;
    }

    else if (currentTool === "fraction") {
        html =
            input("numerator", "صورت کسر") +
            input("denominator", "مخرج کسر");
    }

    else if (currentTool === "power") {
        html =
            select("powerType", "نوع محاسبه", [
                ["power", "توان"],
                ["sqrt", "ریشه دوم"]
            ]) +
            `<div id="powerInputs"></div>`;
    }

    else if (currentTool === "divisibility") {
        html =
            input("number", "عدد") +
            input("divisor", "مقسوم‌علیه");
    }

    else if (currentTool === "evenodd") {
        html = input("number", "عدد");
    }

    else if (currentTool === "prime") {
        html = input("number", "عدد");
    }

    else if (currentTool === "division") {
        html =
            input("a", "عدد اول") +
            input("b", "عدد دوم");
    }

    else if (currentTool === "multiply") {
        html = input("number", "عدد جدول ضرب");
    }

    form.innerHTML = html;

    if (currentTool === "average") {
        document.getElementById("count").addEventListener("input", createGrades);
    }

    if (currentTool === "shape") {
        document.getElementById("shapeType").addEventListener("change", showShapeInputs);
        showShapeInputs();
    }

    if (currentTool === "speed") {
        document.getElementById("speedType").addEventListener("change", showSpeedInputs);
        showSpeedInputs();
    }

    if (currentTool === "power") {
        document.getElementById("powerType").addEventListener("change", showPowerInputs);
        showPowerInputs();
    }

    result.innerHTML = "نتیجه اینجا نمایش داده می‌شود.";
    result.className = "result";
}

function createGrades() {

    const count = Number(document.getElementById("count").value);
    const grades = document.getElementById("grades");

    if (!Number.isInteger(count) || count <= 0 || count > 50) {
        grades.innerHTML = "";
        return;
    }

    let html = "";

    for (let i = 1; i <= count; i++) {
        html += input(`grade${i}`, `نمره ${i}`, "number", "۰ تا ۲۰");
    }

    grades.innerHTML = html;
}

function showShapeInputs() {

    const type = document.getElementById("shapeType").value;
    const box = document.getElementById("shapeInputs");

    if (type === "square") {
        box.innerHTML = input("side", "ضلع مربع");
    }

    else if (type === "rectangle") {
        box.innerHTML =
            input("length", "طول") +
            input("width", "عرض");
    }

    else if (type === "circle") {
        box.innerHTML = input("radius", "شعاع");
    }

    else {
        box.innerHTML =
            input("base", "قاعده") +
            input("height", "ارتفاع") +
            input("side1", "ضلع اول") +
            input("side2", "ضلع دوم") +
            input("side3", "ضلع سوم");
    }
}

function showSpeedInputs() {

    const type = document.getElementById("speedType").value;
    const box = document.getElementById("speedInputs");

    if (type === "speed") {
        box.innerHTML =
            input("distance", "مسافت") +
            input("time", "زمان");
    }

    else if (type === "distance") {
        box.innerHTML =
            input("speed", "سرعت") +
            input("time", "زمان");
    }

    else {
        box.innerHTML =
            input("distance", "مسافت") +
            input("speed", "سرعت");
    }
}

function showPowerInputs() {

    const type = document.getElementById("powerType").value;
    const box = document.getElementById("powerInputs");

    if (type === "power") {
        box.innerHTML =
            input("base", "عدد پایه") +
            input("exponent", "توان");
    }

    else {
        box.innerHTML = input("number", "عدد");
    }
}

function num(id) {
    return Number(document.getElementById(id).value);
}

function validNumber(value) {
    return Number.isFinite(value);
}

function calculate() {

    try {

        let output = "";

        /* معدل */
        if (currentTool === "average") {

            const count = num("count");

            if (!Number.isInteger(count) || count <= 0) {
                throw new Error("تعداد نمره‌ها را درست وارد کنید.");
            }

            let total = 0;

            for (let i = 1; i <= count; i++) {
                const grade = num(`grade${i}`);

                if (!validNumber(grade) || grade < 0 || grade > 20) {
                    throw new Error(`نمره ${i} باید بین ۰ تا ۲۰ باشد.`);
                }

                total += grade;
            }

            const average = total / count;

            output = `مجموع نمره‌ها: ${total}\nمعدل شما: ${average.toFixed(2)}`;
        }

        /* درصد */
        else if (currentTool === "percent") {

            const p = num("percent");
            const n = num("number");

            if (!validNumber(p) || !validNumber(n)) {
                throw new Error("لطفاً اعداد را درست وارد کنید.");
            }

            output = `${p}% از ${n} می‌شود: ${(n * p / 100).toFixed(2)}`;
        }

        /* شکل */
        else if (currentTool === "shape") {

            const type = document.getElementById("shapeType").value;

            if (type === "square") {

                const s = num("side");

                if (s <= 0) throw new Error("ضلع باید مثبت باشد.");

                output =
                    `محیط: ${4 * s}\n` +
                    `مساحت: ${s * s}`;
            }

            else if (type === "rectangle") {

                const l = num("length");
                const w = num("width");

                if (l <= 0 || w <= 0) {
                    throw new Error("طول و عرض باید مثبت باشند.");
                }

                output =
                    `محیط: ${2 * (l + w)}\n` +
                    `مساحت: ${l * w}`;
            }

            else if (type === "circle") {

                const r = num("radius");

                if (r <= 0) throw new Error("شعاع باید مثبت باشد.");

                output =
                    `محیط: ${(2 * Math.PI * r).toFixed(2)}\n` +
                    `مساحت: ${(Math.PI * r * r).toFixed(2)}`;
            }

            else {

                const b = num("base");
                const h = num("height");
                const a = num("side1");
                const c = num("side2");
                const d = num("side3");

                if ([b,h,a,c,d].some(x => x <= 0)) {
                    throw new Error("همه مقادیر باید مثبت باشند.");
                }

                if (a + c <= d || a + d <= c || c + d <= a) {
                    throw new Error("این سه ضلع نمی‌توانند یک مثلث بسازند.");
                }

                output =
                    `محیط: ${a + c + d}\n` +
                    `مساحت: ${(b * h / 2).toFixed(2)}`;
            }
        }

        /* ماشین حساب */
        else if (currentTool === "calculator") {

            const expression = document.getElementById("expression").value.trim();

            if (!expression) {
                throw new Error("عبارت ریاضی را وارد کنید.");
            }

            if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
                throw new Error("فقط اعداد و عملگرهای ریاضی مجاز هستند.");
            }

            const answer = Function('"use strict"; return (' + expression + ')')();

            if (!Number.isFinite(answer)) {
                throw new Error("عبارت قابل محاسبه نیست.");
            }

            output = `نتیجه: ${answer}`;
        }

        /* ب.م.م و ک.م.م */
        else if (currentTool === "gcf") {

            let a = Math.abs(num("a"));
            let b = Math.abs(num("b"));

            if (a === 0 && b === 0) {
                throw new Error("برای هر دو عدد صفر، ب.م.م و ک.م.م تعریف نمی‌شود.");
            }

            const originalA = a;
            const originalB = b;

            while (b !== 0) {
                const temp = a % b;
                a = b;
                b = temp;
            }

            const gcf = a;
            const lcm = originalA === 0 || originalB === 0
                ? 0
                : Math.abs(originalA * originalB) / gcf;

            output =
                `ب.م.م: ${gcf}\n` +
                `ک.م.م: ${lcm}`;
        }

        /* تخفیف */
        else if (currentTool === "discount") {

            const price = num("price");
            const discount = num("discount");

            if (price < 0 || discount < 0 || discount > 100) {
                throw new Error("قیمت یا درصد تخفیف نامعتبر است.");
            }

            const saved = price * discount / 100;
            const finalPrice = price - saved;

            output =
                `مقدار تخفیف: ${saved}\n` +
                `قیمت نهایی: ${finalPrice}`;
        }

        /* تبدیل واحد */
        else if (currentTool === "convert") {

            const type = document.getElementById("conversion").value;
            const v = num("value");

            if (!validNumber(v)) {
                throw new Error("مقدار را درست وارد کنید.");
            }

            let answer;

            if (type === "cm_m") answer = `${v / 100} متر`;
            if (type === "m_cm") answer = `${v * 100} سانتی‌متر`;
            if (type === "kg_g") answer = `${v * 1000} گرم`;
            if (type === "g_kg") answer = `${v / 1000} کیلوگرم`;
            if (type === "c_f") answer = `${(v * 9/5) + 32} °F`;
            if (type === "f_c") answer = `${(v - 32) * 5/9} °C`;
            if (type === "min_sec") answer = `${v * 60} ثانیه`;
            if (type === "sec_min") answer = `${v / 60} دقیقه`;
            if (type === "hour_min") answer = `${v * 60} دقیقه`;
            if (type === "min_hour") answer = `${v / 60} ساعت`;

            output = `نتیجه: ${answer}`;
        }

        /* سرعت */
        else if (currentTool === "speed") {

            const type = document.getElementById("speedType").value;

            if (type === "speed") {

                const d = num("distance");
                const t = num("time");

                if (t <= 0) throw new Error("زمان باید بیشتر از صفر باشد.");

                output = `سرعت: ${d / t}`;
            }

            else if (type === "distance") {

                const s = num("speed");
                const t = num("time");

                output = `مسافت: ${s * t}`;
            }

            else {

                const d = num("distance");
                const s = num("speed");

                if (s <= 0) throw new Error("سرعت باید بیشتر از صفر باشد.");

                output = `زمان: ${d / s}`;
            }
        }

        /* کسر */
        else if (currentTool === "fraction") {

            const a = num("numerator");
            const b = num("denominator");

            if (b === 0) {
                throw new Error("مخرج نمی‌تواند صفر باشد.");
            }

            const decimal = a / b;
            const percentage = decimal * 100;

            output =
                `اعشاری: ${decimal}\n` +
                `درصد: ${percentage.toFixed(2)}%`;
        }

        /* توان و ریشه */
        else if (currentTool === "power") {

            const type = document.getElementById("powerType").value;

            if (type === "power") {

                const base = num("base");
                const exponent = num("exponent");

                output = `نتیجه: ${Math.pow(base, exponent)}`;
            }

            else {

                const n = num("number");

                if (n < 0) {
                    throw new Error("برای عدد منفی، ریشه دوم حقیقی نداریم.");
                }

                output = `√${n} = ${Math.sqrt(n)}`;
            }
        }

        /* بخش پذیری */
        else if (currentTool === "divisibility") {

            const n = num("number");
            const d = num("divisor");

            if (d === 0) {
                throw new Error("مقسوم‌علیه نمی‌تواند صفر باشد.");
            }

            if (n % d === 0) {
                output = `${n} بر ${d} بخش‌پذیر است. ✅`;
            } else {
                output = `${n} بر ${d} بخش‌پذیر نیست. ❌`;
            }
        }

        /* زوج فرد */
        else if (currentTool === "evenodd") {

            const n = num("number");

            output = n % 2 === 0
                ? `${n} یک عدد زوج است.`
                : `${n} یک عدد فرد است.`;
        }

        /* عدد اول */
        else if (currentTool === "prime") {

            const n = num("number");

            if (!Number.isInteger(n)) {
                throw new Error("عدد اول باید عدد صحیح باشد.");
            }

            if (n < 2) {
                output = `${n} عدد اول نیست.`;
            } else {

                let isPrime = true;

                for (let i = 2; i <= Math.sqrt(n); i++) {

                    if (n % i === 0) {
                        isPrime = false;
                        break;
                    }
                }

                output = isPrime
                    ? `${n} عدد اول است. ✅`
                    : `${n} عدد اول نیست. ❌`;
            }
        }

        /* تقسیم */
        else if (currentTool === "division") {

            const a = num("a");
            const b = num("b");

            if (b === 0) {
                throw new Error("تقسیم بر صفر ممکن نیست.");
            }

            output =
                `خارج قسمت: ${Math.trunc(a / b)}\n` +
                `باقی‌مانده: ${a % b}`;
        }

        /* جدول ضرب */
        else if (currentTool === "multiply") {

            const n = num("number");

            if (!validNumber(n)) {
                throw new Error("عدد را وارد کنید.");
            }

            let lines = [];

            for (let i = 1; i <= 20; i++) {
                lines.push(`${n} × ${i} = ${n * i}`);
            }

            output = lines.join("\n");
        }

        result.textContent = output;
        result.className = "result success";

    } catch (error) {

        result.textContent = "⚠️ " + error.message;
        result.className = "result error";
    }
}

/* انتخاب ابزار */

document.querySelectorAll(".tool").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".tool").forEach(x => {
            x.classList.remove("active");
        });

        button.classList.add("active");

        currentTool = button.dataset.tool;

        showForm();
    });
});

/* دکمه اجرا */

document.getElementById("runBtn").addEventListener("click", calculate);

/* پاک کردن */

document.getElementById("clearBtn").addEventListener("click", () => {
    showForm();
});

/* کپی */

document.getElementById("copyBtn").addEventListener("click", async () => {

    const text = result.textContent.trim();

    if (!text || text === "نتیجه اینجا نمایش داده می‌شود.") {
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        const old = document.getElementById("copyBtn").textContent;

        document.getElementById("copyBtn").textContent = "✅ کپی شد";

        setTimeout(() => {
            document.getElementById("copyBtn").textContent = old;
        }, 1200);

    } catch {
        alert("کپی کردن در این مرورگر انجام نشد.");
    }
});

/* اجرای ابزار با Enter */

document.addEventListener("keydown", event => {

    if (event.key === "Enter") {

        const active = document.activeElement;

        if (active && active.tagName === "INPUT") {
            event.preventDefault();
            calculate();
        }
    }
});

/* شروع صفحه */

showForm();

</script>
